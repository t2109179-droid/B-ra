<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Merhaba Büşra - Gelişmiş Örümcek Deneyimi</title>
    <style>
        body {
            overflow: hidden;
            margin: 0;
            background-color: #000;
            touch-action: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        /* iOS Tarzı Sade Durum Paneli */
        #status-panel {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: -0.2px;
            pointer-events: none;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        #status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #cccccc;
        }

        /* İntro Ekranı Stilleri */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #intro-screen h1 {
            font-size: 38px;
            font-weight: 600;
            margin: 0 0 30px 0;
            letter-spacing: -0.5px;
        }
        #start-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 14px 36px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2);
            transition: transform 0.2s ease, background 0.2s ease;
        }
        #start-btn:active {
            transform: scale(0.95);
        }
    </style>
    <!-- MediaPipe Kütüphaneleri -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <!-- İntro Ekranı -->
    <div id="intro-screen">
        <h1>Merhaba Büşra</h1>
        <button id="start-btn" onclick="startApp()">Başlamak İçin Dokun</button>
    </div>

    <div id="status-panel">
        <div id="status-dot"></div>
        <span id="status-text">Kamera izni bekleniyor...</span>
    </div>
    <video id="webcam" style="display:none;" playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        let audioCtx = null;

        function startApp() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            playTone(523.25, 0.15, 'sine');

            const intro = document.getElementById('intro-screen');
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.display = 'none';
                document.getElementById('status-panel').style.opacity = '1';
            }, 800);

            initSystem();
        }

        function playTone(freq, duration, type = 'sine') {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);
                
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start(now);
                osc.stop(now + duration);
            } catch(e) {
                console.error("Ses hatası:", e);
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'catch') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.15);
                gainNode.gain.setValueAtTime(0.25, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'throw') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.12);
                gainNode.gain.setValueAtTime(0.45, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            }
        }

        const canvas = document.getElementById("canvas");
        const statusText = document.getElementById("status-text");
        const statusDot = document.getElementById("status-dot");
        let w, h;
        const ctx = canvas.getContext("2d");
        const { sin, cos, PI, hypot, min, max } = Math;

        let latestLandmarks = null;
        let isHolding = false; 
        let spiderCurrentX = innerWidth / 2;
        let spiderCurrentY = innerHeight / 2;
        
        let vx = 0;
        let vy = 0;
        let lastPinchX = 0;
        let lastPinchY = 0;
        let handWasPresent = false;
        let hitEffectTimer = 0;

        function setStatus(text, color) {
            statusText.innerText = text;
            statusDot.style.backgroundColor = color;
        }

        function spawn() {
            const pts = many(333, () => ({
                x: rnd(innerWidth),
                y: rnd(innerHeight),
                len: 0,
                r: 0
            }));

            const pts2 = many(9, (i) => ({
                x: cos((i / 9) * PI * 2),
                y: sin((i / 9) * PI * 2)
            }));

            let seed = rnd(100);
            let tx = innerWidth / 2;
            let ty = innerHeight / 2;
            let x = tx;
            let y = ty;
            let kx = rnd(0.5, 0.5);
            let ky = rnd(0.5, 0.5);
            let walkRadius = pt(rnd(50, 50), rnd(50, 50));
            let r = innerWidth / rnd(100, 150);

            function paintPt(pt) {
                pts2.forEach((pt2) => {
                    if (!pt.len) return;
                    
                    let offsetX = 0;
                    let offsetY = 0;
                    if (hitEffectTimer > 0) {
                        offsetX = (Math.random() - 0.5) * 16;
                        offsetY = (Math.random() - 0.5) * 16;
                    }

                    drawLine(
                        lerp(x + pt2.x * r, pt.x, pt.len * pt.len) + offsetX,
                        lerp(y + pt2.y * r, pt.y, pt.len * pt.len) + offsetY,
                        x + pt2.x * r + offsetX,
                        y + pt2.y * r + offsetY
                    );
                });
                drawCircle(pt.x + (hitEffectTimer > 0 ? (Math.random()-0.5)*12 : 0), pt.y + (hitEffectTimer > 0 ? (Math.random()-0.5)*12 : 0), pt.r);
            }

            return {
                follow(nx, ny, holding, velocityX = 0, velocityY = 0, launch = false) {
                    if (holding && !isHolding) {
                        playSound('catch');
                    }

                    if (holding) {
                        isHolding = true;
                        tx = Math.max(50, Math.min(innerWidth - 50, nx));
                        ty = Math.max(50, Math.min(innerHeight - 50, ny));
                        vx = 0;
                        vy = 0;
                    } else if (launch) {
                        if (isHolding) {
                            playSound('throw');
                        }
                        isHolding = false;
                        vx = velocityX * 2.0;
                        vy = velocityY * 2.0;
                    } else if (!isHolding && vx === 0 && vy === 0) {
                        tx = Math.max(50, Math.min(innerWidth - 50, nx));
                        ty = Math.max(50, Math.min(innerHeight - 50, ny));
                    }
                },
                tick(t) {
                    const selfMoveX = cos(t * kx + seed) * walkRadius.x;
                    const selfMoveY = sin(t * ky + seed) * walkRadius.y;
                    
                    let fx, fy;
                    const margin = 45;

                    if (isHolding) {
                        fx = Math.max(margin, Math.min(innerWidth - margin, tx));
                        fy = Math.max(margin, Math.min(innerHeight - margin, ty));
                        x += min(innerWidth / 100, (fx - x) / 2);
                        y += min(innerWidth / 100, (fy - y) / 2);
                        vx = 0;
                        vy = 0;
                    } else if (vx !== 0 || vy !== 0) {
                        x += vx;
                        y += vy;
                        vx *= 0.93;
                        vy *= 0.93;

                        let hit = false;
                        // Geliştirilmiş Çarpma ve Sınır Tepkisi
                        if (x < margin) { x = margin; vx = -vx * 0.8; hit = true; }
                        if (x > innerWidth - margin) { x = innerWidth - margin; vx = -vx * 0.8; hit = true; }
                        if (y < margin) { y = margin; vy = -vy * 0.8; hit = true; }
                        if (y > innerHeight - margin) { y = innerHeight - margin; vy = -vy * 0.8; hit = true; }

                        if (hit && (Math.abs(vx) > 1 || Math.abs(vy) > 1)) {
                            playSound('hit');
                            hitEffectTimer = 12;
                        }

                        if (hypot(vx, vy) < 0.6) { vx = 0; vy = 0; }
                    } else {
                        fx = Math.max(margin, Math.min(innerWidth - margin, tx + selfMoveX));
                        fy = Math.max(margin, Math.min(innerHeight - margin, ty + selfMoveY));
                        x += min(innerWidth / 100, (fx - x) / 10);
                        y += min(innerWidth / 100, (fy - y) / 10);
                    }

                    if (hitEffectTimer > 0) hitEffectTimer--;

                    spiderCurrentX = x;
                    spiderCurrentY = y;

                    let i = 0;
                    pts.forEach((pt) => {
                        const dx = pt.x - x,
                              dy = pt.y - y;
                        const len = hypot(dx, dy);
                        let baseR = isHolding ? 3.5 : 2; 
                        let r = min(baseR, innerWidth / len / 5);
                        pt.t = 0;
                        const increasing = len < innerWidth / 10 && (i++) < 8;
                        let dir = increasing ? 0.1 : -0.1;
                        if (increasing) r *= 1.5;
                        pt.r = r;
                        pt.len = max(0, min(pt.len + dir, 1));
                        paintPt(pt);
                    });
                }
            };
        }

        const spider = spawn();

        const HAND_CONNECTIONS = [
            [0,1],[1,2],[2,3],[3,4],
            [0,5],[5,6],[6,7],[7,8],
            [5,9],[9,10],[10,11],[11,12],
            [9,13],[13,14],[14,15],[15,16],
            [13,17],[17,18],[18,19],[19,20],
            [0,17]
        ];

        function drawHandSkeleton(landmarks) {
            ctx.shadowBlur = 0;
            ctx.strokeStyle = isHolding ? "rgba(52, 199, 89, 0.7)" : "rgba(255, 255, 255, 0.35)";
            ctx.lineWidth = isHolding ? 2.5 : 1.5;

            HAND_CONNECTIONS.forEach(([i, j]) => {
                const p1 = landmarks[i];
                const p2 = landmarks[j];
                ctx.beginPath();
                ctx.moveTo((1 - p1.x) * innerWidth, p1.y * innerHeight);
                ctx.lineTo((1 - p2.x) * innerWidth, p2.y * innerHeight);
                ctx.stroke();
            });

            ctx.fillStyle = isHolding ? "rgba(52, 199, 89, 0.9)" : "rgba(255, 255, 255, 0.7)";
            landmarks.forEach((p, index) => {
                let radius = (index === 8 || index === 4) ? 5 : 2.5;
                drawCircle((1 - p.x) * innerWidth, p.y * innerHeight, radius);
            });
        }

        function initSystem() {
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.65,
                minTrackingConfidence: 0.65
            });

            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    handWasPresent = true;
                    latestLandmarks = results.multiHandLandmarks[0];

                    const thumbTip = latestLandmarks[4];
                    const indexTip = latestLandmarks[8];
                    
                    const pinchX = (1 - ((thumbTip.x + indexTip.x) / 2)) * innerWidth;
                    const pinchY = ((thumbTip.y + indexTip.y) / 2) * innerHeight;

                    const pinchDist = hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);
                    const isPinched = pinchDist < 0.055;

                    const distToSpider = hypot(pinchX - spiderCurrentX, pinchY - spiderCurrentY);

                    let wasHolding = isHolding;

                    if (isPinched && (distToSpider < 120 || isHolding)) {
                        isHolding = true;
                        setStatus("Örümcek Tutuldu! Savurun veya Kameradan Çekin", "#34c759");
                    } else {
                        isHolding = false;
                    }

                    let throwVx = pinchX - lastPinchX;
                    let throwVy = pinchY - lastPinchY;

                    lastPinchX = pinchX;
                    lastPinchY = pinchY;

                    if (wasHolding && !isHolding) {
                        setStatus("Örümcek Fırlatıldı!", "#ff9500");
                        spider.follow(pinchX, pinchY, false, throwVx, throwVy, true);
                    } else {
                        spider.follow(pinchX, pinchY, isHolding, 0, 0, false);
                    }

                } else {
                    if (handWasPresent && isHolding) {
                        setStatus("Örümcek Fırlatıldı! (El Çıktı)", "#ff9500");
                        spider.follow(spiderCurrentX, spiderCurrentY, false, lastPinchX ? (lastPinchX - spiderCurrentX)/4 : 12, lastPinchY ? (lastPinchY - spiderCurrentY)/4 : -12, true);
                    }
                    handWasPresent = false;
                    latestLandmarks = null;
                    isHolding = false;
                    setStatus("Kamera Aktif - El Bekleniyor", "#cccccc");
                }
            });

            const videoElement = document.getElementById('webcam');
            const camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 640,
                height: 480
            });

            camera.start().then(() => {
                setStatus("Kamera Hazır, El Bekleniyor", "#cccccc");
            }).catch(err => {
                setStatus("Kamera Erişimi Reddedildi", "#ff3b30");
                console.error(err);
            });
        }

        requestAnimationFrame(function anim(t) {
            if (w !== innerWidth) w = canvas.width = innerWidth;
            if (h !== innerHeight) h = canvas.height = innerHeight;
            
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#000";
            drawCircle(0, 0, w * 10);
            
            ctx.fillStyle = ctx.strokeStyle = "#fff";
            t /= 1000;
            
            spider.tick(t);

            if (latestLandmarks) {
                drawHandSkeleton(latestLandmarks);
            }

            requestAnimationFrame(anim);
        });

        function rnd(x = 1, dx = 0) {
            return Math.random() * x + dx;
        }

        function drawCircle(x, y, r) {
            ctx.beginPath();
            ctx.ellipse(x, y, r, r, 0, 0, PI * 2);
            ctx.fill();
        }

        function drawLine(x0, y0, x1, y1) {
            ctx.beginPath();
            ctx.moveTo(x0, y0);
            many(100, (i) => {
                i = (i + 1) / 100;
                let x = lerp(x0, x1, i);
                let y = lerp(y0, y1, i);
                let k = noise(x / 5 + x0, y / 5 + y0) * 2;
                ctx.lineTo(x + k, y + k);
            });
            ctx.stroke();
        }

        function many(n, f) {
            return [...Array(n)].map((_, i) => f(i));
        }

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function noise(x, y, t = 101) {
            let w0 = sin(0.3 * x + 1.4 * t + 2.0 + 2.5 * sin(0.4 * y + -1.3 * t + 1.0));
            let w1 = sin(0.2 * y + 1.5 * t + 2.8 + 2.3 * sin(0.5 * x + -1.2 * t + 0.5));
            return w0 + w1;
        }

        function pt(x, y) {
            return { x, y };
        }
    </script>
</body>
</html>
